<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">
    <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
    <link rel="icon" type="image/x-icon" href="{{ '/favicon.ico' | relative_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;1,400&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
</head>
<body>
    <a href="#main-content" class="skip-link">Skip to Content</a>
    
    {% include header.html %}

    <main id="main-content">
        <div class="container">
            <div class="content-wrapper">
                <article>
                    {{ content }}
                </article>
            </div>
        </div>
    </main>

    {% include footer.html %}
    
    <script src="{{ '/js/main.js' | relative_url }}"></script>
    <script src="{{ '/js/interference.js' | relative_url }}"></script>
</body>
</html>
